<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <title>Editar Cliente</title>
</head>
<body>

<div class="container">
    <h2>Editar Cliente</h2>

    <form id="formEditCliente"
          th:action="@{/cliente/guardarcliente}"
          th:object="${cliente}"
          method="post"
          class="profile-form">

        <!-- DPI oculto para enviar al controller -->
        <input type="hidden" th:field="*{dpiCliente}">

        <!-- DPI visible solo lectura -->
        <div>
            <label>DPI:</label>
            <input type="text"
                   th:value="${cliente.dpiCliente}"
                   readonly>
        </div>

        <div>
            <label for="nombreCliente">Nombre:</label>
            <input type="text"
                   id="nombreCliente"
                   th:field="*{nombreCliente}"
                   required>
        </div>

        <div>
            <label for="apellidoCliente">Apellido:</label>
            <input type="text"
                   id="apellidoCliente"
                   th:field="*{apellidoCliente}"
                   required>
        </div>

        <div>
            <label for="direccionCliente">Dirección:</label>
            <input type="text"
                   id="direccionCliente"
                   th:field="*{direccionCliente}"
                   required>
        </div>

        <div>
            <label>Estado:</label>
            <select th:field="*{estadoCliente}">
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>
        </div>

        <button type="submit">Actualizar</button>

    </form>
</div>

</body>
</html>
