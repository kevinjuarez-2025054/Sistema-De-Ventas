<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <div class="left">
            <div class="imagen">
                <img src="https://mediodigital.mx/wp-content/uploads/2023/03/que-es-un-sistema-punto-de-venta-2.png" alt="">
            </div>
        </div>

        <div class="right">
            <h2>Login</h2>
            <form th:action="@{/logear}" method="post">
                <div class="input-group">
                    <input type="text"  name="username"  placeholder="usuario" required>
                </div>
                <div class="input-group">
                    <input type="password"  name="password"  placeholder="contraseña" required>
                </div>
                <button type="submit">Login</button>
                <div class="switch">
                    <a th:href="@{/register}" style="color: cyan;">¿No tienes cuenta? Regístrate</a>
                </div>
            </form>

            <div th:if="${error}" class="error">
                <span th:text="${error}" ></span>
            </div>
        </div>
    </div>
</body>
</html>
