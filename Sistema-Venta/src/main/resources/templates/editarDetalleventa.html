<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Detalle Venta</title>
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
</head>
<body>
<div class="container">
    <h2>Editar Detalle de Venta</h2>

    <form th:action="@{/actualizarDetalleVenta}" th:object="${detalleVenta}" method="post">

        <input type="hidden" th:field="*{codigoDetalleVenta}">
        <input type="hidden" th:field="*{producto.codigoProducto}">
        <input type="hidden" th:field="*{venta.codigoVenta}">

        <div>
            <label>Código:</label>
            <input type="text" th:value="${detalleVenta.codigoDetalleVenta}" readonly>
        </div>
        <div>
            <label>Cantidad:</label>
            <input type="number" th:field="*{cantidad}" required>
        </div>
        <div>
            <label>Precio Unitario:</label>
            <input type="number" step="0.01" th:field="*{precioUnitario}" required>
        </div>
        <div>
            <label>Subtotal:</label>
            <input type="number" step="0.01" th:field="*{subtotal}" required>
        </div>

        <button type="submit">Actualizar</button>
    </form>
</div>
</body>
</html>
