<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
</head>
<body>

<div class="container">
    <h2>Editar Producto</h2>

    <form th:action="@{/actualizarProducto}"
      th:object="${producto}"
      method="post">

        <input type="hidden" th:field="*{codigoProducto}">

        <div>
            <label>Código:</label>
            <input type="text" th:value="${producto.codigoProducto}" readonly>
        </div>

        <div>
            <label>Nombre:</label>
            <input type="text" th:field="*{nombreProducto}" required>
        </div>

        <div>
            <label>Precio:</label>
            <input type="number" step="0.01" th:field="*{precio}" required>
        </div>

        <div>
            <label>Stock:</label>
            <input type="number" th:field="*{stock}" required>
        </div>

        <div>
            <label>Estado:</label>
            <select th:field="*{estado}">
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>
        </div>

        <button type="submit">Actualizar</button>

    </form>
</div>

</body>
</html>
